# suanPan MaterialParser.cpp — extraction of lines 1-1957 (handlers new_afc01 .. new_customj2).
# Source of truth: /workspace/Material/MaterialParser.cpp lines 29-1956.
# The keyword dispatch (create_new_material) lies BELOW line 1957, so per instructions:
#   - 'keyword' is derived from the handler name (new_xxx -> Xxx).
#   - 'aliases' is empty (dispatch spellings not verifiable in range).
# 'tag' is always the first param after the keyword (int, required, fatal).
# Optional pattern meanings:
#   - required   : `if(!get_input(command, x)) return;`  -> missing/invalid token is fatal.
#   - optional   : `auto x = DEF; if(command.eof()) ... else if(!get_input(...)) return;`
#                  or `if(!command.eof() && !get_input(...)) return;` or `get_optional_input`
#                  -> token optional; when present but invalid it is still fatal; default = DEF.
#   - fixed lists: `vec v(N); get_input(command, v)` reads exactly N tokens, all required;
#                  `get_optional_input(command, v)` on an initializer-list vec reads up to N
#                  tokens, each element optional (missing tail keeps the C++ default element).
# Numeric 'default' values are the EXACT C++ literals, quoted as strings.
# Convention: density, when accepted, is always the LAST positional param.

