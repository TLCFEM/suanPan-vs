# =============================================================================
# suanPan Section parsing spec — extracted from /workspace/Section/SectionParser.cpp
# (3076 lines, read in full)
#
# - All keywords are matched case-insensitively (is_equal / is_equal_any).
# - create_new_section reads the section type token first, then dispatches.
# - Unlike other suanPan parsers, this file contains NO mid-stream option flags
#   (verified: no is_equal(para, ...), is_true, get_optional_input or to_token
#   anywhere in the file). Every argument is strictly positional, so every
#   entry below has flags: [].
# - Unknown section types fall through to external_module::object (plugin modules).
# - "Handler" = the new_* free function that parses the arguments.
# =============================================================================

