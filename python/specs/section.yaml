    - {name: eccentricity, type: float, req: false, default: 0.}
  flags: []
  rest: null
  notes: 'Handler new_isection2d(..., recenter=false). dim = vec(6): [TFW, TFT, BFW, BFT, WH, WT] (top flange width/thickness, bottom flange width/thickness, web height, web thickness). Shares handler with ISection2DC (recenter=true).'

- keyword: ISection2DC
  aliases: []
  cpp: ISection2D
  params:
    - {name: tag, type: int, req: true}
    - {name: dim, type: float_list, req: true}
    - {name: material_tag, type: int, req: true}
    - {name: int_pt, type: int, req: false, default: 6}
  flags: []
  rest: null
  notes: 'Handler new_isection2d(..., recenter=true). "C" = recenter: eccentricity is NOT parsed from input; it is computed as barycenter(dim) (elastic centroid of the I profile: -.5*(Af_t*(t_f+ h_w) + Af_b*(t_fb + h_w)) / (Af_t + Af_b + h_w*t_w) with dim(0..5) = [TFW, TFT, BFW, BFT, WH, WT]).'

