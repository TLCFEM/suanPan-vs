# Machine-readable parsing spec extracted from suanPan Solver/SolverParser.cpp
# (create_new_integrator + create_new_solver). Helper semantics verified in
# Toolbox/utility.h/.cpp:
#   - get_input: stream >> var; failure => fatal => param required (req: true).
#   - get_optional_input / "!"command.eof() && !get_input": missing tokens keep
#     the C++ default => req: false with default; a present but unparsable token
#     is still fatal.
#   - get_input(stream, Col<T>) (pre-sized vec) reads EXACTLY n_elem values.
#   - get_remaining<T> consumes ALL remaining tokens as a list;
#     get_remaining<T1,T2,...> consumes remaining tokens in fixed-size groups
#     (pairs/quadruples) returning one list per position.
#   - is_equal/is_equal_any: case-insensitive (_strcmpi). if_contain on
#     uppercased strings: case-insensitive substring test.
# Common post-processing on successful insert (both dispatches): if the current
# step tag != 0, step->set_integrator_tag/set_solver_tag(tag) is called, then
# domain->set_current_integrator_tag/set_current_solver_tag(tag). On failure an
# error mentioning the remaining command text is emitted.
# NOTE: integrator_type tokens containing "newmark" (case-insensitive) enter the
# Newmark-family branch; if they then match none of its exact sub-keywords the
# creation fails. alpha/beta in that branch are read only if any token remains
# and BOTH are required when present (guarded by !command.eof()).

integrators:
  - keyword: Newmark
    aliases: []
    cpp: Newmark
    params:
      - {name: tag, type: int, req: true}
      - {name: alpha, type: float, req: false, default: 0.25, meaning: 'Newmark alpha; read only if tokens remain after tag, in which case beta is also required'}
      - {name: beta, type: float, req: false, default: 0.5, meaning: 'Newmark beta; read only if tokens remain after tag, in which case alpha is also required'}
    flags: []
    rest: null
    notes: 'Dispatch: type contains "newmark" AND is_equal(type,"Newmark").'
  - keyword: RayleighNewmark
    aliases: []
    cpp: RayleighNewmark
    params:
      - {name: tag, type: int, req: true}
      - {name: alpha, type: float, req: false, default: 0.25, meaning: 'paired with beta (both required if any token remains)'}
      - {name: beta, type: float, req: false, default: 0.5, meaning: 'paired with alpha (both required if any token remains)'}
      - {name: damping_alpha, type: float, req: false, default: 0.0, meaning: 'Rayleigh damping param 1 (mass, m1); up to 4 tokens consumed, present tokens are fatal if unparsable'}
      - {name: damping_beta, type: float, req: false, default: 0.0, meaning: 'Rayleigh damping param 2 (stiffness, s1)'}
      - {name: damping_zeta, type: float, req: false, default: 0.0, meaning: 'Rayleigh damping param 3 (mass, m2)'}
      - {name: damping_eta, type: float, req: false, default: 0.0, meaning: 'Rayleigh damping param 4 (stiffness, s2)'}
    flags: []
    rest: null
    notes: 'Reads up to 4 trailing floats (while !eof && idx<4; each read fatal on failure). suanpan_warning if sum of the 4 params == 0 ("consider use plain Newmark").'
  - keyword: LeeNewmark
    aliases: []
    cpp: LeeNewmark
    params:
      - {name: tag, type: int, req: true}
      - {name: alpha, type: float, req: false, default: 0.25, meaning: 'paired with beta (both required if any token remains)'}
      - {name: beta, type: float, req: false, default: 0.5, meaning: 'paired with alpha (both required if any token remains)'}
    flags: []
    rest: {type: float_list, req: false, grouping: 2, meaning: 'get_remaining<double,double>: tokens consumed in pairs; first of each pair -> damping coefficient list, second -> frequency list; each pair defines one internal damping mode (ctor LeeNewmark(tag, damping_coef[], frequency[], alpha, beta))'}
    notes: ''
  - keyword: LeeNewmarkIterative
    aliases: []
    cpp: LeeNewmarkIterative
    params:
      - {name: tag, type: int, req: true}
      - {name: alpha, type: float, req: false, default: 0.25, meaning: 'paired with beta (both required if any token remains)'}
      - {name: beta, type: float, req: false, default: 0.5, meaning: 'paired with alpha (both required if any token remains)'}
    flags:
      - {name: '-type0', value_type: 'float[2]', default: null, meaning: 'block flag (case-insensitive): adds mode Type::T0 with p=[]; args: zeta_p (float, error text "zeta_p"), omega_p (float, error text "omega_p"); both required'}
      - {name: '-type1', value_type: 'float[3]', default: null, meaning: 'block flag: adds mode Type::T1 with p=[trunc(a)]; args: zeta_p omega_p a; a truncated to unsigned integer (count)'}
      - {name: '-type2', value_type: 'float[4]', default: null, meaning: 'block flag: adds mode Type::T2 with p=[trunc(a), trunc(b)]; args: zeta_p omega_p a b; a and b truncated to unsigned integers (counts)'}
      - {name: '-type3', value_type: 'float[3]', default: null, meaning: 'block flag: adds mode Type::T3 with p=[a]; args: zeta_p omega_p a; a used as-is (float, NOT truncated)'}
      - {name: '-type4', value_type: 'float[7]', default: null, meaning: 'block flag: adds mode Type::T4 with p=[trunc(a), trunc(b), trunc(c), trunc(d), e]; args: zeta_p omega_p a b c d e; a-d truncated to unsigned integers, e used as-is (float)'}
    rest: {type: flag_blocks, req: false, meaning: 'zero or more repeating blocks while tokens remain; each block starts with one of the -typeN flags above followed by its args; every token (flag and args) is fatal if missing/unparsable; unknown flag -> fatal "A valid type is required."; trailing incomplete block is a fatal error'}
    notes: ''
