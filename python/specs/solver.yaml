    cpp: MPDC
    params:
      - {name: tag, type: int, req: true}
    flags: []
    rest: null
    notes: 'is_equal_any(type,"DisplacementControl","MPDC"); both construct MPDC(tag) with no further parsing.'
  - keyword: Ramm
    aliases: []
    cpp: Ramm
    params:
      - {name: tag, type: int, req: true}
    flags: []
    rest: null
    notes: ''
