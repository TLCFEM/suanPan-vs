      - {name: '-type1', value_type: 'float[3]', default: null, meaning: 'block flag: mode Type::T1, p=[trunc(a)]; args: zeta_p omega_p a (a truncated to unsigned integer)'}
      - {name: '-type2', value_type: 'float[4]', default: null, meaning: 'block flag: mode Type::T2, p=[trunc(a), trunc(b)]; args: zeta_p omega_p a b (a,b truncated to unsigned integers)'}
      - {name: '-type3', value_type: 'float[3]', default: null, meaning: 'block flag: mode Type::T3, p=[a]; args: zeta_p omega_p a (a used as-is, float)'}
      - {name: '-type4', value_type: 'float[7]', default: null, meaning: 'block flag: mode Type::T4, p=[trunc(a), trunc(b), trunc(c), trunc(d), e]; args: zeta_p omega_p a b c d e (a-d truncated, e float)'}
    rest: {type: flag_blocks, req: false, meaning: 'zero or more -typeN blocks (identical parsing to LeeNewmarkIterative); all block tokens fatal if missing/unparsable; unknown flag is fatal'}
    notes: 'Exact is_equal(type,"LeeNewmarkFullInitial") -> StiffnessType::INITIAL.'
  - keyword: WilsonPenzienNewmark
    aliases: []
    cpp: WilsonPenzienNewmark
    params:
      - {name: tag, type: int, req: true}
      - {name: alpha, type: float, req: false, default: 0.25, meaning: 'paired with beta (both required if any token remains)'}
      - {name: beta, type: float, req: false, default: 0.5, meaning: 'paired with alpha (both required if any token remains)'}
    flags: []
    rest: {type: float_list, req: false, grouping: 1, meaning: 'get_remaining<double>: all remaining tokens consumed as a list of damping ratios (zeta) of the auxiliary SDOF Wilson-Penzien systems (ctor WilsonPenzienNewmark(tag, damping_ratio[], alpha, beta)); may be empty'}
    notes: ''
  - keyword: NonviscousNewmark
    aliases: []
    cpp: NonviscousNewmark
    params:
      - {name: tag, type: int, req: true}
      - {name: alpha, type: float, req: false, default: 0.25, meaning: 'paired with beta (both required if any token remains)'}
      - {name: beta, type: float, req: false, default: 0.5, meaning: 'paired with alpha (both required if any token remains)'}
    flags: []
    rest: {type: float_list, req: false, grouping: 4, meaning: 'get_remaining<double,double,double,double>: tokens consumed in quadruples (m_real, m_imag, s_real, s_imag) per kernel term; built into complex weight vector m = {m_r, m_i} and complex pole vector s = {s_r, s_i} (ctor UDNewmark(tag, alpha, beta, m, s))'}
    notes: 'Validations (fatal): sum of imaginary parts <= 1E-12 ("Parameters should be conjugate pairs."); |sum(m % exp(-1E8*s))| <= 1E-12 ("The provided kernel does not converge to zero.").'
  - keyword: UDDNewmark
    aliases: []
    cpp: UDDNewmark
    params:
      - {name: tag, type: int, req: true}
      - {name: alpha, type: float, req: false, default: 0.25, meaning: 'paired with beta (both required if any token remains)'}
      - {name: beta, type: float, req: false, default: 0.5, meaning: 'paired with alpha (both required if any token remains)'}
    flags: []
    rest: {type: float_list, req: false, grouping: 4, meaning: 'get_remaining<double,double,double,double>: tokens consumed in quadruples (m_real, m_imag, s_real, s_imag) per kernel term; complex weight vector m and complex pole vector s (ctor UDNewmark(tag, alpha, beta, m, s))'}
    notes: 'Validations (fatal): sum of imaginary parts <= 1E-12 (conjugate pairs); error "UDD requires both weights (m_j) and poles (s_j) to have negative real parts." if any(m_real > 0) AND any(s_real > 0) (check is conjunctive).'
  - keyword: UDANewmark
    aliases: []
    cpp: UDANewmark
    params:
      - {name: tag, type: int, req: true}
      - {name: alpha, type: float, req: false, default: 0.25, meaning: 'paired with beta (both required if any token remains)'}
      - {name: beta, type: float, req: false, default: 0.5, meaning: 'paired with alpha (both required if any token remains)'}
    flags: []
    rest: {type: float_list, req: false, grouping: 4, meaning: 'get_remaining<double,double,double,double>: tokens consumed in quadruples (m_real, m_imag, s_real, s_imag) per kernel term; complex weight vector m and complex pole vector s (ctor UDNewmark(tag, alpha, beta, m, s))'}
    notes: 'Validations (fatal): sum of imaginary parts <= 1E-12 (conjugate pairs); error "UDA requires weights (m_j) to have positive real parts and poles (s_j) to have negative real parts." if any(m_real < 0) AND any(s_real > 0) (check is conjunctive).'
