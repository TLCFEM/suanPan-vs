solvers:
  - keyword: Newton
    aliases: []
    cpp: Newton
    params:
      - {name: tag, type: int, req: true}
    flags: []
    rest: null
    notes: 'Full Newton (Newton(tag), constant-stiffness flag = false). modifiedNewton/mNewton are SEPARATE dispatch keywords (see below), not aliases.'
  - keyword: modifiedNewton
    aliases: [mNewton]
    cpp: Newton
    params:
      - {name: tag, type: int, req: true}
    flags: []
    rest: null
    notes: 'is_equal_any(type,"modifiedNewton","mNewton"); constructs Newton(tag, true) i.e. the modified/constant-stiffness variant. Not a true alias of Newton (different constructor argument).'
  - keyword: AICN
    aliases: []
    cpp: AICN
    params:
      - {name: tag, type: int, req: true}
      - {name: length, type: float, req: false, default: 1.0, meaning: 'arc length, guarded by "!command.eof() && !get_input"'}
    flags: []
    rest: null
    notes: ''
  - keyword: BFGS
    aliases: []
    cpp: BFGS
    params:
      - {name: tag, type: int, req: true}
    flags: []
    rest: null
    notes: ''
  - keyword: LBFGS
    aliases: []
    cpp: BFGS
    params:
      - {name: tag, type: int, req: true}
      - {name: max_history, type: int, req: false, default: 20, meaning: 'guarded by "!command.eof() && !get_input"; error text "A valid maximum step number is required."; passed to BFGS(tag, max_history)'}
    flags: []
    rest: null
    notes: 'Limited-memory variant implemented via BFGS with history length.'
  - keyword: FEAST
    aliases: []
    cpp: FEAST
    params:
      - {name: tag, type: int, req: true}
      - {name: eigen_number, type: int, req: true, meaning: 'number of frequencies to extract; fatal if missing ("A valid number of frequencies is required.")'}
      - {name: centre, type: float, req: true, meaning: 'centre of the search interval; fatal if missing (error text misleadingly says "A valid radius is required.")'}
      - {name: radius, type: float, req: false, default: null, meaning: 'radius of the search interval; optional via get_optional_input; C++ default is the value of centre'}
    flags: []
    rest: null
    notes: 'Quadratic flag = false (ctor FEAST(tag, eigen_number, centre, radius, false)).'
  - keyword: QuadraticFEAST
    aliases: []
    cpp: FEAST
    params:
      - {name: tag, type: int, req: true}
      - {name: eigen_number, type: int, req: true, meaning: 'number of frequencies to extract; fatal if missing'}
      - {name: centre, type: float, req: true, meaning: 'centre of the search interval; fatal if missing (error text says "A valid radius is required.")'}
      - {name: radius, type: float, req: false, default: null, meaning: 'radius of the search interval; optional via get_optional_input; C++ default is the value of centre'}
