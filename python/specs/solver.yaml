      - {name: alpha, type: float, req: false, default: 0.25, meaning: 'paired with beta (both required if any token remains)'}
      - {name: beta, type: float, req: false, default: 0.5, meaning: 'paired with alpha (both required if any token remains)'}
    flags: []
    rest: {type: float_list, req: false, grouping: 2, meaning: 'get_remaining<double,double>: tokens consumed in pairs; first of each pair -> damping coefficient list, second -> frequency list (ctor LeeElementalNewmark(tag, damping_coef[], frequency[], alpha, beta))'}
    notes: ''
  - keyword: LeeNewmarkFullTrial
    aliases: []
    cpp: LeeNewmarkFull
    params:
      - {name: tag, type: int, req: true}
      - {name: alpha, type: float, req: false, default: 0.25, meaning: 'paired with beta (both required if any token remains)'}
      - {name: beta, type: float, req: false, default: 0.5, meaning: 'paired with alpha (both required if any token remains)'}
    flags:
      - {name: '-type0', value_type: 'float[2]', default: null, meaning: 'block flag: mode Type::T0, p=[]; args: zeta_p omega_p'}
      - {name: '-type1', value_type: 'float[3]', default: null, meaning: 'block flag: mode Type::T1, p=[trunc(a)]; args: zeta_p omega_p a (a truncated to unsigned integer)'}
      - {name: '-type2', value_type: 'float[4]', default: null, meaning: 'block flag: mode Type::T2, p=[trunc(a), trunc(b)]; args: zeta_p omega_p a b (a,b truncated to unsigned integers)'}
      - {name: '-type3', value_type: 'float[3]', default: null, meaning: 'block flag: mode Type::T3, p=[a]; args: zeta_p omega_p a (a used as-is, float)'}
      - {name: '-type4', value_type: 'float[7]', default: null, meaning: 'block flag: mode Type::T4, p=[trunc(a), trunc(b), trunc(c), trunc(d), e]; args: zeta_p omega_p a b c d e (a-d truncated, e float)'}
    rest: {type: flag_blocks, req: false, meaning: 'zero or more -typeN blocks (identical parsing to LeeNewmarkIterative); all block tokens fatal if missing/unparsable; unknown flag is fatal'}
    notes: 'Branch entry: first 14 chars of type == "LeeNewmarkFull" (case-insensitive, size>=14). Final dispatch requires exact is_equal(type,"LeeNewmarkFullTrial") -> StiffnessType::TRIAL; a type entering the branch but matching no Full keyword fails after parsing blocks.'
  - keyword: LeeNewmarkFullCurrent
    aliases: [LeeNewmarkFull]
    cpp: LeeNewmarkFull
    params:
      - {name: tag, type: int, req: true}
      - {name: alpha, type: float, req: false, default: 0.25, meaning: 'paired with beta (both required if any token remains)'}
      - {name: beta, type: float, req: false, default: 0.5, meaning: 'paired with alpha (both required if any token remains)'}
    flags:
      - {name: '-type0', value_type: 'float[2]', default: null, meaning: 'block flag: mode Type::T0, p=[]; args: zeta_p omega_p'}
      - {name: '-type1', value_type: 'float[3]', default: null, meaning: 'block flag: mode Type::T1, p=[trunc(a)]; args: zeta_p omega_p a (a truncated to unsigned integer)'}
      - {name: '-type2', value_type: 'float[4]', default: null, meaning: 'block flag: mode Type::T2, p=[trunc(a), trunc(b)]; args: zeta_p omega_p a b (a,b truncated to unsigned integers)'}
      - {name: '-type3', value_type: 'float[3]', default: null, meaning: 'block flag: mode Type::T3, p=[a]; args: zeta_p omega_p a (a used as-is, float)'}
      - {name: '-type4', value_type: 'float[7]', default: null, meaning: 'block flag: mode Type::T4, p=[trunc(a), trunc(b), trunc(c), trunc(d), e]; args: zeta_p omega_p a b c d e (a-d truncated, e float)'}
    rest: {type: flag_blocks, req: false, meaning: 'zero or more -typeN blocks (identical parsing to LeeNewmarkIterative); all block tokens fatal if missing/unparsable; unknown flag is fatal'}
    notes: 'is_equal_any(type,"LeeNewmarkFullCurrent","LeeNewmarkFull") -> StiffnessType::CURRENT; bare "LeeNewmarkFull" is the default Full variant.'
  - keyword: LeeNewmarkFullInitial
    aliases: []
    cpp: LeeNewmarkFull
    params:
      - {name: tag, type: int, req: true}
      - {name: alpha, type: float, req: false, default: 0.25, meaning: 'paired with beta (both required if any token remains)'}
      - {name: beta, type: float, req: false, default: 0.5, meaning: 'paired with alpha (both required if any token remains)'}
    flags:
