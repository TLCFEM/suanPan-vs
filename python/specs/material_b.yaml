# suanPan material parser spec (part B)
# Source of truth: /workspace/Material/MaterialParser.cpp
# Covers handler functions defined at lines 1958-3828, dispatched by
# create_new_material() (lines 3676-3828).
#
# Conventions:
#   req: true  -> parsed with get_input(); missing/invalid token aborts parsing (fatal) => required.
#   req: false -> guarded by `!command.eof() && !get_input(...)` or get_optional_input();
#                 missing token is fine, `default` is the C++ default value.
#   expression_tag -> int referencing an `expression` object.
#   int_list/float_list -> consumed via get_remaining<T>() / get_remaining<T1,T2,...>()
#   Keyword matching is case-insensitive; aliases lists all matched spellings (lowercased)
#   besides the primary `keyword`.

