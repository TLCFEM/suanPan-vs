jobs:
  ubuntu-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v7
      - name: node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: |
          npm install
          npx vsce package
      - if: contains(github.event.head_commit.message, '[publish]')
        name: Publish
        run: |
          npx vsce publish -p ${{ secrets.PUB_TOKEN }}
          npx ovsx publish -p ${{ secrets.OVSX }}
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: vscode-plugin
          path: '*.vsix'
name: Develop
'on':
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
